# Tests et construction sur chaque demande de fusion ; déploiement sur GitHub Pages à chaque fusion dans main.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Sur une demande de fusion, un nouveau commit annule les vérifications en cours.
# Sur main, un déploiement commencé n'est jamais interrompu : l'annuler en pleine publication
# peut bloquer GitHub Pages pour les suivants. La fusion suivante attend son tour ; si
# plusieurs attendent, seule la plus récente est déployée.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # Versions exactes de package-lock.json : une nouvelle version d'une dépendance
      # n'entre qu'avec un commit qui met à jour ce fichier.
      - name: Installer les dépendances
        run: npm ci --no-audit --no-fund
      - name: Tests du moteur et de la session
        run: npm test
      - name: Vérification des types
        run: npm run typecheck
      - name: Construction
        run: npm run build
      - name: Préparer la publication
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Déployer sur GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
